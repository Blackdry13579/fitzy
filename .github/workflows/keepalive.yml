name: Keep Render awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "User-Agent: fitzy-keepalive-github-actions" \
            "https://fitzy-mtsz.onrender.com/api/health"
